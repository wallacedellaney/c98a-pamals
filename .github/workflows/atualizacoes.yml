name: Atualizações automáticas

# 2026-09-01, a pedido do Wallace: reduzido de "de 2 em 2h + disponibilidade
# diária de 30 em 30 min" pra **1x por dia, seg-sex, todas as fontes
# juntas** — o ciclo antigo (histórico abaixo) gerava commit binário demais
# (.xlsx não comprime diff, cada rodada grava o arquivo quase inteiro de
# novo) e inflou o .git do repo pra 1,3 GB. Sem problema rodar sem ter nada
# novo — cada fonte só commita se algo realmente mudou (ver
# shared/executar_atualizacao.py). Horário: 11h07 UTC = 8h07 local
# (Brasil, sem horário de verão, é UTC-3) — mesmo minuto quebrado (:07, não
# hora cheia) do ciclo antigo, pra reduzir atraso do agendamento gratuito
# do GitHub.
#
# Histórico (até 2026-09-01): rodava de 2 em 2h, seg-sex — contorna o
# atraso do agendamento gratuito do GitHub (confirmado em 2026-07-07:
# agendado pra 13h/15h UTC, só rodou de verdade às 19h25/21h06 UTC).
# Disponibilidade Diária tinha um agendamento PRÓPRIO, de 30 em 30 minutos
# (2026-07-28, Wallace: "cara a disp diaria roda de 30 em 30 min") — o
# relatório é postado num horário imprevisível de manhã, e esperar até 2h
# pelo próximo ciclo "todos" fazia a checagem perder a janela com
# frequência. Removido junto com a redução pra 1x/dia (2026-09-01,
# Wallace: "quero uma vez ao dia" / "tudo").
on:
  schedule:
    - cron: "7 11 * * 1-5"
  workflow_dispatch:
    inputs:
      fonte:
        description: "Fonte para atualizar manualmente (ou 'todos')"
        required: true
        type: choice
        default: "todos"
        options:
          - todos
          - disponibilidade_diaria
          - emergencias
          - pagamentos
          - rac
          - vencimentos_tmot
          - mta
          - tpjl
          - tpjl_extras
          - reparaveis
          - devolucoes
          - motores
          - reajuste

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar credencial do Google (a partir do Secret)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p .secrets
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/service_account.json

      - name: Configurar identidade git (pro commit automático)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Buscar, reprocessar e enviar pro GitHub
        run: python3 shared/executar_atualizacao.py "${{ inputs.fonte || 'todos' }}"
